<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoidMind Omega System</title>
<style>
:root{
  --bg:#030305;--panel:rgba(255,255,255,.045);--line:rgba(139,92,246,.22);
  --text:#f5f7ff;--muted:#8d92a3;--blue:#60a5fa;--purple:#a78bfa;
  --pink:#f472b6;--cyan:#22d3ee;--indigo:#818cf8;--yellow:#facc15;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:#030305;color:var(--text)}
body{overflow-x:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;position:relative;background:
 radial-gradient(ellipse at top,rgba(88,28,135,.22),transparent 48%),
 radial-gradient(circle at 20% 90%,rgba(37,99,235,.08),transparent 28%),#030305}
.app:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(139,92,246,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.045) 1px,transparent 1px);background-size:60px 60px}
.glow{position:fixed;width:380px;height:380px;border-radius:50%;filter:blur(100px);opacity:.12;pointer-events:none}
.glow.a{top:-100px;left:15%;background:#3b82f6}.glow.b{bottom:-100px;right:15%;background:#9333ea}
main{position:relative;z-index:2;padding-bottom:105px}
.container{max-width:1050px;margin:auto;padding:0 22px}
.header{padding:28px 0 24px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.42);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px}.brand-icon{font-size:30px;color:var(--blue);filter:drop-shadow(0 0 12px rgba(96,165,250,.65))}
.title{font-size:28px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);-webkit-background-clip:text;color:transparent}
.kicker{font-size:11px;letter-spacing:.22em;color:#777d8f;margin-top:5px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.clock{text-align:right;color:var(--purple);font-size:25px;font-weight:800}.date{font-size:10px;color:#656a78;letter-spacing:.12em}
.status{margin-top:24px;padding:16px;border:1px solid rgba(139,92,246,.3);border-radius:18px;background:linear-gradient(90deg,rgba(168,85,247,.1),rgba(59,130,246,.08));display:flex;justify-content:space-between;align-items:center}
.status-left{display:flex;align-items:center;gap:15px}.orb-small{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#111827 45%,#7c3aed 46%,#2563eb 72%,transparent 73%);box-shadow:0 0 28px rgba(124,58,237,.35);font-size:24px}
.badge{padding:6px 10px;border-radius:999px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.22);color:#86efac;font-size:10px;letter-spacing:.12em}
.grid{display:grid;gap:16px}.stats-grid{grid-template-columns:repeat(3,1fr);margin-top:20px}.two{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:20px;backdrop-filter:blur(16px);box-shadow:0 10px 45px rgba(0,0,0,.18)}
.metric{display:flex;align-items:center;gap:12px}.metric-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px}.blue{color:#60a5fa}.purple{color:#a78bfa}.pink{color:#f472b6}.cyan{color:#22d3ee}.violet{color:#c4b5fd}.indigo{color:#818cf8}.yellow{color:#facc15}.green{color:#4ade80}
.metric-label{font-size:11px;color:#7d8290;letter-spacing:.1em}.metric-value{font-size:30px;font-weight:800;margin-top:4px}
.progress{height:6px;background:#171923;border-radius:99px;overflow:hidden;margin-top:13px}.bar{height:100%;border-radius:99px;background:linear-gradient(90deg,#3b82f6,#a855f7);box-shadow:0 0 14px rgba(139,92,246,.5)}
.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-title{font-size:18px;font-weight:750}.muted{color:var(--muted);font-size:12px}
.chart{width:100%;height:230px;display:block}.legend{display:flex;gap:20px;font-size:11px;color:#8d92a3;margin-top:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.72);border-top:1px solid var(--line);backdrop-filter:blur(22px)}
.nav-inner{max-width:650px;margin:auto;padding:10px 8px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.nav-btn{border:0;background:transparent;color:#666b79;padding:8px 3px;border-radius:13px;font-size:9px;font-weight:800;letter-spacing:.08em}.nav-btn span{display:block;font-size:21px;margin-bottom:3px}.nav-btn.active{background:rgba(139,92,246,.09);color:#a78bfa}
.page{padding:28px 0}.page-head{display:flex;align-items:center;gap:12px;margin-bottom:25px}.page-icon{font-size:25px}.page-title{font-size:24px;font-weight:800;background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;color:transparent}
.hero-orb{height:270px;display:grid;place-items:center;position:relative}.rings{width:190px;height:190px;border:1px solid rgba(167,139,250,.25);border-radius:50%;position:relative;animation:spin 18s linear infinite}.rings:before,.rings:after{content:"";position:absolute;border:1px solid rgba(96,165,250,.2);border-radius:50%;inset:18px;animation:spin 11s linear reverse infinite}.rings:after{inset:40px;border-color:rgba(244,114,182,.22);animation-duration:8s}.core{position:absolute;width:105px;height:105px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4b5fd,#7c3aed 35%,#1e1b4b 65%,#050507 72%);box-shadow:0 0 55px rgba(124,58,237,.6),0 0 100px rgba(59,130,246,.2);animation:pulse 2.5s ease-in-out infinite}
.ai-box{text-align:center;min-height:80px}.ai-message{font-size:19px;line-height:1.6;color:#ddd;min-height:60px}.cursor{color:#a78bfa;animation:blink .8s infinite}
textarea{width:100%;min-height:150px;resize:vertical;background:rgba(0,0,0,.35);border:1px solid rgba(139,92,246,.22);border-radius:14px;color:#fff;padding:15px;outline:none}textarea:focus{border-color:rgba(167,139,250,.7);box-shadow:0 0 25px rgba(124,58,237,.12)}
.btn{border:1px solid rgba(139,92,246,.35);background:linear-gradient(90deg,rgba(124,58,237,.25),rgba(59,130,246,.18));color:#fff;padding:11px 16px;border-radius:12px;font-weight:750}.btn:hover{border-color:#a78bfa;box-shadow:0 0 20px rgba(124,58,237,.18)}
.entries{display:grid;gap:12px;margin-top:18px}.entry{position:relative}.entry p{white-space:pre-wrap;line-height:1.55;color:#d5d7df;margin:12px 0}.entry-meta{display:flex;justify-content:space-between;align-items:center;color:#707687;font-size:10px}.emotion{padding:5px 8px;border-radius:8px;border:1px solid rgba(167,139,250,.25);color:#c4b5fd;background:rgba(139,92,246,.08)}
.delete{position:absolute;right:15px;top:15px;border:0;background:transparent;color:#666;cursor:pointer}.delete:hover{color:#f87171}
.profile{display:flex;gap:18px;align-items:center}.avatar{width:82px;height:82px;border-radius:22px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,#7c3aed,#2563eb);box-shadow:0 0 35px rgba(124,58,237,.3)}
.level{font-size:12px;color:#999}.level strong{font-size:32px;color:#fff}.xp{margin-top:10px}.attr{display:grid;gap:13px}.attr-row{display:grid;grid-template-columns:130px 1fr 45px;gap:10px;align-items:center;font-size:12px}.achievements{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.achievement{text-align:center;padding:18px 10px;border:1px solid rgba(255,255,255,.07);border-radius:15px;background:rgba(255,255,255,.025)}.achievement .aicon{font-size:26px;margin-bottom:8px}.locked{opacity:.3}
.void-mode{min-height:calc(100vh - 105px);display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}.void-clock{font-size:clamp(58px,12vw,120px);font-weight:200;letter-spacing:.08em;color:#eee;text-shadow:0 0 35px rgba(167,139,250,.22)}.quote{max-width:720px;font-size:clamp(18px,3vw,28px);color:#8f93a2;line-height:1.6;font-weight:300}.void-date{font-size:11px;color:#555;letter-spacing:.2em;text-transform:uppercase}.void-toggle{margin-top:22px;border:1px solid rgba(139,92,246,.22);background:rgba(255,255,255,.03);color:#777;border-radius:999px;padding:10px 16px}
.analysis{border-color:rgba(96,165,250,.2);background:linear-gradient(135deg,rgba(124,58,237,.08),rgba(37,99,235,.05))}
.small-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{padding:15px;border-radius:13px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06)}.mini b{font-size:21px}
@keyframes pulse{50%{transform:scale(1.05);opacity:.82}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}
@media(max-width:720px){.stats-grid,.two,.achievements{grid-template-columns:1fr}.small-grid{grid-template-columns:1fr 1fr}.toprow{flex-direction:column}.clock{text-align:left}.nav-inner{grid-template-columns:repeat(6,1fr)}.nav-btn{font-size:8px}.title{font-size:23px}.attr-row{grid-template-columns:105px 1fr 40px}}
@media(max-width:430px){.nav-btn span{font-size:18px}.container{padding:0 15px}.small-grid{grid-template-columns:1fr}.status{align-items:flex-start;gap:12px;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<div class="glow a"></div><div class="glow b"></div>
<main id="app"></main>
<nav><div class="nav-inner">
<button class="nav-btn" data-page="dashboard"><span>🧠</span>NEURAL</button>
<button class="nav-btn" data-page="ai"><span>✦</span>VOID IA</button>
<button class="nav-btn" data-page="journal"><span>📖</span>DIÁRIO</button>
<button class="nav-btn" data-page="stats"><span>▥</span>DADOS</button>
<button class="nav-btn" data-page="profile"><span>◉</span>PERFIL</button>
<button class="nav-btn" data-page="void"><span>○</span>VOID</button>
</div></nav>
</div>
<script>
const state={page:'dashboard',entries:JSON.parse(localStorage.getItem('voidmind_journal')||'[]')};

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function header(icon,title,kicker){return `<div class="header"><div class="container"><div class="page-head" style="margin:0"><div class="page-icon">${icon}</div><div><div class="page-title">${title}</div><div class="kicker">${kicker}</div></div></div></div></div>`}
function cardMetric(label,value,icon,color){return `<div class="card"><div class="metric"><div class="metric-icon ${color}" style="background:rgba(96,165,250,.08)">${icon}</div><div><div class="metric-label">${label}</div><div class="metric-value ${color}">${value}%</div></div></div><div class="progress"><div class="bar" style="width:${value}%;background:linear-gradient(90deg,${colorHex(color)},#a855f7)"></div></div></div>`}
function colorHex(c){return {blue:'#60a5fa',purple:'#a78bfa',pink:'#f472b6',cyan:'#22d3ee',violet:'#c4b5fd',indigo:'#818cf8'}[c]||'#a78bfa'}
function canvasChart(id,data,labels,colors){setTimeout(()=>{const c=document.getElementById(id);if(!c)return;const ctx=c.getContext('2d'),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;for(let y=20;y<h-20;y+=(h-40)/4){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()} data.forEach((series,si)=>{ctx.strokeStyle=colors[si];ctx.lineWidth=2.5;ctx.shadowBlur=10;ctx.shadowColor=colors[si];ctx.beginPath();series.forEach((v,i)=>{const x=30+i*(w-55)/(series.length-1),y=h-28-v*(h-55)/100;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.shadowBlur=0;series.forEach((v,i)=>{const x=30+i*(w-55)/(series.length-1),y=h-28-v*(h-55)/100;ctx.fillStyle=colors[si];ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill()});});ctx.fillStyle='#74798a';ctx.font='11px system-ui';labels.forEach((l,i)=>ctx.fillText(l,20+i*(w-55)/(labels.length-1),h-7))},20)}
function dashboard(){return `<div class="header"><div class="container"><div class="toprow"><div><div class="brand"><div class="brand-icon">🧠</div><div class="title">VoidMind Omega System</div></div><div class="kicker">PAINEL NEURAL • MONITORAMENTO EM TEMPO REAL</div></div><div class="clock"><span id="liveClock">--:--:--</span><div class="date" id="liveDate"></div></div></div><div class="status"><div class="status-left"><div class="orb-small">◉</div><div><b>USUÁRIO EM OBSERVAÇÃO</b><div class="muted">Consciência neural sincronizada • evolução estável</div></div></div><span class="badge">● ONLINE</span></div></div></div>
<div class="container page">
<div class="grid stats-grid">
${cardMetric('ENERGIA MENTAL',72,'ϟ','blue')}${cardMetric('PRODUTIVIDADE',88,'◎','purple')}${cardMetric('NÍVEL DE FOCO',85,'◉','cyan')}${cardMetric('CONSISTÊNCIA',76,'◌','pink')}${cardMetric('ESTABILIDADE',78,'≈','violet')}${cardMetric('EVOLUÇÃO COGNITIVA',90,'↗','indigo')}
</div>
<div class="card section"><div class="section-head"><div><div class="section-title">Atividade mental</div><div class="muted">Oscilação cognitiva ao longo do dia</div></div><span class="purple">● LIVE</span></div><canvas class="chart" id="mentalChart"></canvas><div class="legend"><span><i class="dot" style="background:#60a5fa"></i>Nível mental</span></div></div>
<div class="grid two section"><div class="card"><div class="section-title">Leitura neural</div><div class="muted">Índices atuais</div><div class="small-grid" style="margin-top:15px"><div class="mini"><div class="muted">CLAREZA</div><b class="blue">90%</b></div><div class="mini"><div class="muted">FOCO</div><b class="pink">85%</b></div><div class="mini"><div class="muted">ENERGIA</div><b class="purple">72%</b></div></div></div><div class="card analysis"><div class="section-title">Análise do sistema</div><p class="muted" style="line-height:1.7">Padrões atuais indicam desempenho cognitivo elevado, estabilidade emocional moderada e necessidade de preservar períodos de baixa estimulação.</p></div></div>
</div>`}
const aiMessages=["Detectando padrões elevados de introspecção...","Sua evolução cognitiva continua superando os parâmetros base.","Níveis de exaustão social indicam necessidade de solidão.","Monitorando deterioração emocional coletiva em andamento.","Índice de clareza mental demonstra desempenho ótimo.","Reconhecimento de padrões: aumento de contemplação filosófica detectado.","Seus caminhos neurais demonstram adaptabilidade excepcional.","Analisando mudanças comportamentais em tempo real.","Consciência void expandindo além dos limiares mensuráveis.","Resiliência psicológica permanece dentro do intervalo estável.","Detectando flutuações sutis de ansiedade no ambiente.","Distribuição de carga cognitiva ótima para as tarefas atuais.","Observando a lenta descida da humanidade ao entorpecimento digital."];
function ai(){return `${header('✦','VOID IA','INTERFACE DE CONSCIÊNCIA NEURAL')}<div class="container page"><div class="hero-orb"><div class="rings"></div><div class="core"></div></div><div class="card ai-box"><div class="muted" style="letter-spacing:.18em;margin-bottom:10px">ANÁLISE AUTÔNOMA</div><div id="aiMessage" class="ai-message"></div><span class="cursor">▌</span></div><div class="grid two section"><div class="card"><div class="section-title purple">◈ Padrões detectados</div><p class="muted" style="line-height:1.8">Introspecção elevada<br>Adaptabilidade cognitiva<br>Estabilidade dentro dos limites</p></div><div class="card"><div class="section-title cyan">◌ Estado neural</div><p class="muted" style="line-height:1.8">Sincronização: 98.4%<br>Latência: 0.03ms<br>Consciência: ATIVA</p></div></div></div>`}
function analyze(t){let s=t.toLowerCase();if(/ansiedade|ansioso|preocup/.test(s))return['Ansiedade',75];if(/triste|sozinho|vazio/.test(s))return['Melancolia',68];if(/feliz|alegre|bem/.test(s))return['Alegria',85];if(/raiva|irritado|bravo/.test(s))return['Raiva',70];if(/calm|paz|tranquil/.test(s))return['Serenidade',90];if(/pens|reflet|contempla/.test(s))return['Contemplação',82];return['Neutro',50]}
function journal(){return `${header('📖','DIÁRIO VOID','REGISTRO E ANÁLISE EMOCIONAL')}<div class="container page"><div class="card"><div class="section-title">Novo registro</div><div class="muted" style="margin:5px 0 14px">Escreva sem filtro. O sistema fará uma leitura simples de padrões.</div><textarea id="journalText" placeholder="O que está passando pela sua mente?"></textarea><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" onclick="saveEntry()">◈ ANALISAR E SALVAR</button></div></div><div id="entries" class="entries">${renderEntries()}</div></div>`}
function renderEntries(){if(!state.entries.length)return `<div class="card" style="text-align:center;padding:45px"><div style="font-size:32px;opacity:.35">∅</div><div class="muted">Nenhum registro ainda.</div></div>`;return state.entries.map(e=>`<div class="card entry"><button class="delete" onclick="deleteEntry('${e.id}')">×</button><div class="entry-meta"><span>${new Date(e.timestamp).toLocaleDateString('pt-BR')} • ${new Date(e.timestamp).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span><span class="emotion">${esc(e.emotion)} · ${e.intensity}%</span></div><p>${esc(e.content)}</p><div class="progress"><div class="bar" style="width:${e.intensity}%"></div></div></div>`).join('')}
function saveEntry(){const ta=document.getElementById('journalText');if(!ta||!ta.value.trim())return;const btn=document.querySelector('.btn');btn.disabled=true;btn.textContent='ANALISANDO...';setTimeout(()=>{const [emotion,intensity]=analyze(ta.value);state.entries.unshift({id:String(Date.now()),content:ta.value.trim(),timestamp:Date.now(),emotion,intensity});localStorage.setItem('voidmind_journal',JSON.stringify(state.entries));render();},900)}
function deleteEntry(id){state.entries=state.entries.filter(e=>e.id!==id);localStorage.setItem('voidmind_journal',JSON.stringify(state.entries));render()}
function stats(){return `${header('▥','ESTATÍSTICAS MENTAIS','RASTREAMENTO DE EVOLUÇÃO PSICOLÓGICA')}<div class="container page"><div class="grid stats-grid">${cardMetric('COGNITIVO',87,'🧠','blue')}${cardMetric('ENERGIA',72,'ϟ','purple')}${cardMetric('FOCO',85,'◉','pink')}${cardMetric('ESTABILIDADE',84,'◌','cyan')}</div><div class="card section"><div class="section-title">Evolução psicológica semanal</div><div class="muted">Rastreamento mental multidimensional</div><canvas class="chart" id="weekChart"></canvas><div class="legend"><span><i class="dot" style="background:#f472b6"></i>Foco</span><span><i class="dot" style="background:#a78bfa"></i>Energia</span><span><i class="dot" style="background:#22d3ee"></i>Estabilidade</span></div></div><div class="grid two section"><div class="card"><div class="section-title">Detecção de ansiedade</div><div class="muted">Monitoramento 24 horas</div><canvas class="chart" id="anxietyChart"></canvas></div><div class="card"><div class="section-title">Perfil cognitivo</div><div class="muted">Capacidades neurais</div><div class="attr" style="margin-top:18px">${[['Lógica',88],['Criatividade',92],['Memória',78],['Processamento',85],['Análise',90],['Intuição',82]].map(x=>`<div class="attr-row"><span>${x[0]}</span><div class="progress"><div class="bar" style="width:${x[1]}%;background:#3b82f6"></div></div><b class="blue">${x[1]}</b></div>`).join('')}</div></div></div><div class="card section"><div class="section-title">Padrão de produtividade diária</div><div class="muted">Horários de pico de desempenho</div><canvas class="chart" id="prodChart"></canvas></div></div>`}
function profile(){const attrs=[['Foco Mental',85,'cyan'],['Disciplina',78,'purple'],['Clareza',90,'blue'],['Energia',72,'pink'],['Resiliência',88,'violet'],['Evolução',92,'indigo']];const ach=[['🧠','Pioneiro Neural',1],['◉','Caminhante do Vazio',1],['◎','Mestre da Mente',1],['✦','Pensador Profundo',0],['↗','Sábio da Evolução',0],['ϟ','Buscador de Clareza',1]];return `${header('◉','PERFIL NEURAL','MATRIZ DE IDENTIDADE PSICOLÓGICA')}<div class="container page"><div class="card"><div class="profile"><div class="avatar">◉</div><div><div class="muted">NÍVEL NEURAL</div><div class="level"><strong>82</strong> / 100</div><div class="xp"><div class="muted">15.420 / 20.000 XP</div><div class="progress"><div class="bar" style="width:77.1%"></div></div></div></div></div></div><div class="card section"><div class="section-title">Atributos cognitivos</div><div class="attr" style="margin-top:18px">${attrs.map(a=>`<div class="attr-row"><span>${a[0]}</span><div class="progress"><div class="bar" style="width:${a[1]}%;background:${colorHex(a[2])}"></div></div><b class="${a[2]}">${a[1]}</b></div>`).join('')}</div></div><div class="card section"><div class="section-title">Conquistas</div><div class="grid achievements" style="margin-top:15px">${ach.map(a=>`<div class="achievement ${a[2]?'':'locked'}"><div class="aicon">${a[0]}</div><div class="muted">${a[1]}</div></div>`).join('')}</div></div></div>`}
const quotes=["No vazio, nos encontramos.","O silêncio fala mais alto que o ruído.","A mente em repouso enxerga tudo.","A solidão é a forja da sabedoria.","Na escuridão, a clareza emerge.","O observador torna-se o observado.","A consciência flui como a água.","O tempo é uma ilusão da mente inquieta.","No vazio, existem possibilidades infinitas.","Os pensamentos mais profundos florescem no silêncio.","Somos o universo se experienciando.","O isolamento revela a verdade.","O vazio contém tudo.","A quietude é a maior professora.","Na ausência do ruído, a sabedoria fala."];
let quoteIndex=0;
function voidPage(){return `<div class="void-mode"><div><div class="void-date" id="voidDate"></div><div class="void-clock" id="voidClock"></div><div class="quote" id="voidQuote">${quotes[quoteIndex]}</div><button class="void-toggle" onclick="this.textContent=this.textContent.includes('SILÊNCIO')?'🔊 ÁUDIO ATIVO':'🔇 MODO SILÊNCIO'">🔇 MODO SILÊNCIO</button></div></div>`}
function render(){let content=state.page==='dashboard'?dashboard():state.page==='ai'?ai():state.page==='journal'?journal():state.page==='stats'?stats():state.page==='profile'?profile():voidPage();document.getElementById('app').innerHTML=content;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));if(state.page==='dashboard'){updateClock();canvasChart('mentalChart',[[65,45,75,85,70,60]],['00h','04h','08h','12h','16h','20h'],['#60a5fa'])}if(state.page==='stats'){canvasChart('weekChart',[[75,82,78,88,85,72,68],[68,72,75,80,76,70,65],[82,78,85,80,88,90,92]],['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],['#f472b6','#a78bfa','#22d3ee']);canvasChart('anxietyChart',[[35,25,45,55,50,40,38]],['00','04','08','12','16','20','24'],['#facc15']);canvasChart('prodChart',[[40,75,85,70,80,90,65]],['06','09','12','15','18','21','00'],['#818cf8'])}if(state.page==='ai')startAI();if(state.page==='void')startVoid()}
function updateClock(){const d=new Date(),t=d.toLocaleTimeString('pt-BR'),date=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();const a=document.getElementById('liveClock'),b=document.getElementById('liveDate');if(a)a.textContent=t;if(b)b.textContent=date}
let clockTimer;function startAI(){let i=0,c=0;const el=document.getElementById('aiMessage');clearInterval(window.aiTimer);window.aiTimer=setInterval(()=>{if(!el)return clearInterval(window.aiTimer);const msg=aiMessages[i];el.textContent=msg.slice(0,c++);if(c>msg.length){c=0;i=(i+1)%aiMessages.length}},55)}
function startVoid(){clearInterval(window.voidTimer);function tick(){const d=new Date(),t=d.toLocaleTimeString('pt-BR');const c=document.getElementById('voidClock'),dt=document.getElementById('voidDate');if(c)c.textContent=t;if(dt)dt.textContent=d.toLocaleDateString('pt-BR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});};tick();window.voidTimer=setInterval(tick,1000);clearInterval(window.quoteTimer);window.quoteTimer=setInterval(()=>{quoteIndex=(quoteIndex+1)%quotes.length;const q=document.getElementById('voidQuote');if(q)q.textContent=quotes[quoteIndex]},15000)}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{state.page=b.dataset.page;render();window.scrollTo({top:0,behavior:'smooth'})}));
render();setInterval(()=>{if(state.page==='dashboard')updateClock()},1000);
</script>
</body>
</html>
